spring:
  application:
    name: modulithimpl
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
#      for production change to validate and adopt flyway
  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: true