spring:
  application:
    name: modulithimpl
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5455/mydatabase}
    username: ${DB_USERNAME:myuser}
    password: ${DB_PASSWORD:secret}
  jpa:
    hibernate:
      ddl-auto: validate
#      for production change to validate and adopt flyway
  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: true